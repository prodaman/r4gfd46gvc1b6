name: Clean guiATV EPG

on:

  # Ejecutar automáticamente cada hora
  schedule:
    - cron: '0 * * * *'

  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:

  clean:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Descargar repositorio
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Ejecutar PHP
      # ==========================================

      - name: Ejecutar limpieza EPG
        run: |

          php clean_epg.php


      # ==========================================
      # 3. Comprobar que se creó el archivo
      # ==========================================

      - name: Comprobar archivo generado
        run: |

          if [ ! -f "guiatv_limpio.xml.gz" ]; then

            echo "ERROR: No se ha generado guiatv_limpio.xml.gz"

            exit 1

          fi

          echo "Archivo generado correctamente."

          ls -lh guiatv_limpio.xml.gz


      # ==========================================
      # 4. Comparar con la versión existente
      # ==========================================

      - name: Comprobar si ha cambiado
        id: comprobar
        run: |

          if git cat-file -e HEAD:guiatv_limpio.xml.gz 2>/dev/null; then

            echo "Existe una versión anterior."

            git show HEAD:guiatv_limpio.xml.gz > /tmp/guiatv_anterior.xml.gz

            OLD_HASH=$(sha256sum /tmp/guiatv_anterior.xml.gz | awk '{print $1}')
            NEW_HASH=$(sha256sum guiatv_limpio.xml.gz | awk '{print $1}')

            echo "Hash anterior:"
            echo "$OLD_HASH"

            echo "Hash nuevo:"
            echo "$NEW_HASH"

            if [ "$OLD_HASH" = "$NEW_HASH" ]; then

              echo ""
              echo "========================================"
              echo "El EPG limpio NO ha cambiado."
              echo "No se hará ningún commit."
              echo "========================================"

              echo "changed=false" >> "$GITHUB_OUTPUT"

            else

              echo ""
              echo "========================================"
              echo "El EPG limpio HA CAMBIADO."
              echo "Se actualizará."
              echo "========================================"

              echo "changed=true" >> "$GITHUB_OUTPUT"

            fi

          else

            echo ""
            echo "No existe todavía guiatv_limpio.xml.gz."
            echo "Se creará por primera vez."

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================
      # 5. Commit y Push
      # ==========================================

      - name: Commit y push
        if: steps.comprobar.outputs.changed == 'true'
        run: |

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add guiatv_limpio.xml.gz

          git commit -m "Update cleaned guiATV EPG"

          git push
