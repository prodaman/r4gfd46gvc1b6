name: Clean guiATV EPG

on:
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Descargar EPG original y comprobar cambios
        run: |

          mkdir -p epg_temp

          URL="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv_sincolor.xml.gz"

          echo "Descargando EPG original..."

          curl -L --fail --silent --show-error \
            "$URL" \
            -o epg_temp/guiatv_sincolor.xml.gz.new

          if [ ! -s epg_temp/guiatv_sincolor.xml.gz.new ]; then
            echo "ERROR: El archivo descargado está vacío."
            exit 1
          fi

          NEW_HASH=$(sha256sum epg_temp/guiatv_sincolor.xml.gz.new | awk '{print $1}')

          echo "Hash nuevo:"
          echo "$NEW_HASH"

          if [ -f epg_temp/guiatv_sincolor.xml.gz ]; then

            OLD_HASH=$(sha256sum epg_temp/guiatv_sincolor.xml.gz | awk '{print $1}')

            echo "Hash anterior:"
            echo "$OLD_HASH"

            if [ "$OLD_HASH" = "$NEW_HASH" ]; then
              echo ""
              echo "El EPG original NO ha cambiado."
              echo "No es necesario generar un nuevo archivo."

              exit 0
            fi

            echo ""
            echo "El EPG original HA CAMBIADO."

          else

            echo ""
            echo "No existe una copia anterior."
            echo "Se procesará el archivo."

          fi

          mv epg_temp/guiatv_sincolor.xml.gz.new \
             epg_temp/guiatv_sincolor.xml.gz

      - name: Preparar PHP
        run: |

          cp epg_temp/guiatv_sincolor.xml.gz \
             guiATV_original.xml.gz

      - name: Ejecutar limpieza del EPG
        run: |

          php clean_epg.php

      - name: Comprobar cambios en el archivo limpio
        run: |

          if git diff --quiet -- guiATV_limpio.xml.gz; then

            echo ""
            echo "El archivo limpio no ha cambiado."
            echo "No se hará ningún commit."

            exit 0

          fi

          echo ""
          echo "El archivo limpio ha cambiado."
          echo "Se actualizará el repositorio."

      - name: Guardar versión del EPG original
        run: |

          mkdir -p epg_temp

          cp guiATV_original.xml.gz \
             epg_temp/guiatv_sincolor.xml.gz

      - name: Commit y push
        run: |

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add guiATV_limpio.xml.gz

          git commit -m "Update cleaned guiATV EPG"

          git push
